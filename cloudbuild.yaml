# Cloud Build: imaji gercek amd64 donaniminda build edip Artifact Registry'ye push eder.
# (Apple Silicon'da yerel QEMU emulasyonu Next/Turbopack'i segfault ettirdigi icin
#  build'i buluta tasiyoruz.)
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '-t'
      - '${_IMAGE}'
      - '.'
images:
  - '${_IMAGE}'
options:
  # Next build bellek/CPU isteyebilir; daha guclu makine kullan.
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
